<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>arch | AI System Design Assistant</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: 'var(--bg)',
              surface: 'var(--surface)',
              'surface-alt': 'var(--surface-alt)',
              ink: 'var(--ink)',
              'ink-muted': 'var(--ink-muted)',
              line: 'var(--line)',
              accent: 'var(--accent)',
              'accent-hover': 'var(--accent-hover)',
              'accent-ink': 'var(--accent-ink)',
            },
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'],
              display: ['Fraunces', 'Georgia', 'serif'],
            },
          },
        },
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #F6F1E9;
        --surface: #FFFDF8;
        --surface-alt: #EFE8DC;
        --ink: #1A1A1A;
        --ink-muted: #4A453E;
        --line: #DDD3C3;
        --accent: #D9593D;
        --accent-hover: #BF4A30;
        --accent-ink: #B5442B;
        --grid-line: rgba(26, 26, 26, 0.06);
        --selection: rgba(217, 89, 61, 0.22);
        --shadow-soft: 0 24px 60px -32px rgba(26, 26, 26, 0.35);
        --shadow-frame: 0 30px 70px -24px rgba(26, 26, 26, 0.45), 0 8px 20px -12px rgba(26, 26, 26, 0.18);
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        background-color: var(--bg);
        color: var(--ink-muted);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 17px;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      h1, h2, h3, h4 {
        color: var(--ink);
      }
      h1, h2 {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 500;
        letter-spacing: -0.02em;
        line-height: 1.1;
        text-wrap: balance;
      }
      p {
        text-wrap: pretty;
      }
      :where(a, button, input, textarea, select):focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      ::selection {
        background: var(--selection);
        color: var(--ink);
      }
      .grid-paper {
        background-image:
          linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
        background-size: 32px 32px;
      }
      @keyframes hero-in {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: none; }
      }
      .hero-fade {
        animation: hero-in 600ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--ink-muted);
      }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
        .hero-fade { animation: none; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "framer-motion": "https://esm.sh/framer-motion@^12.23.26",
    "lucide-react": "https://esm.sh/lucide-react@^0.560.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.1/",
    "react/": "https://esm.sh/react@^19.2.1/",
    "react": "https://esm.sh/react@^19.2.1"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
